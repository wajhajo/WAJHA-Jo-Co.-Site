/* ============ design system — carried over unchanged ============ */
:root{
  --navy:#0E2436; --navy-2:#16324A; --navy-3:#1F3A55;
  --orange:#F05A12; --orange-hi:#D84E0B; --orange-ink:#C4430A; --orange-soft:#FFEDE2;
  --sand:#FBF6EE; --paper:#FFFFFF;
  --ink:#16202A; --muted:#5A6470; --line:#E6DCCD;
  --on-dark:#FBF6EE; --on-dark-muted:#A8B6C4;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:72px; --s6:104px;
  --measure:64ch;
  --fs:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --paper:#0B1620; --sand:#101E2A; --ink:#EDE8E2; --muted:#A3AEB8;
    --line:#26333F; --orange-ink:#FF8A47; --orange-soft:#3D2114;
    --navy:#081420; --navy-2:#12283C; --navy-3:#1B3247;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1620; --sand:#101E2A; --ink:#EDE8E2; --muted:#A3AEB8;
  --line:#26333F; --orange-ink:#FF8A47; --orange-soft:#3D2114;
  --navy:#081420; --navy-2:#12283C; --navy-3:#1B3247;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(78px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fs);
  font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
html[data-lang="ar"] .en{display:none!important}
html[data-lang="en"] .ar{display:none!important}
html[data-lang="en"] body{line-height:1.7}
img,svg{max-width:100%;height:auto}
.skip{position:absolute;inset-inline-start:-9999px;top:0;z-index:100;
  background:var(--orange);color:#fff;padding:12px 20px;font-weight:600;
  border-radius:0 0 var(--r-md) var(--r-md)}
.skip:focus{inset-inline-start:var(--s3)}
a{color:inherit;text-decoration:none}
:where(a,button):focus-visible{outline:3px solid var(--orange);outline-offset:3px;
  border-radius:6px}
h1,h2,h3{margin:0;font-weight:700;line-height:1.28;letter-spacing:-.012em}
h1{font-size:clamp(33px,5.3vw,60px);line-height:1.16}
h2{font-size:clamp(26px,3.6vw,40px)}
h3{font-size:19px;font-weight:600;line-height:1.5}
p{margin:0}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 var(--s3)}
section{padding:var(--s6) 0}
.sand{background:var(--sand)}
.dark{background:var(--navy);color:var(--on-dark)}
.dark h2,.dark h3{color:var(--on-dark)}
.dark p{color:var(--on-dark-muted)}

/* bar motif — the structural device across the page */
.head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:5px;padding-bottom:11px;flex:0 0 auto}
.bars i{display:block;width:6px;border-radius:3px;background:var(--line)}
.bars i:nth-child(1){height:10px}
.bars i:nth-child(2){height:18px}
.bars i:nth-child(3){height:28px;background:var(--orange)}
.dark .bars i{background:var(--navy-3)}
.dark .bars i:nth-child(3){background:var(--orange)}
.lede{color:var(--muted);max-width:var(--measure);font-size:19px;
  margin-bottom:var(--s5)}
.dark .lede{color:var(--on-dark-muted)}

/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;font-weight:600;
  font-size:16.5px;padding:14px 28px;border-radius:var(--r-md);
  border:2px solid transparent;font-family:var(--fs);cursor:pointer;
  transition:background .18s ease,border-color .18s ease,color .18s ease}
.btn-main{background:var(--orange);color:#fff}
.btn-main:hover{background:var(--orange-hi)}
.btn-line{border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.dark .btn-line{border-color:var(--navy-3);color:var(--on-dark)}
.dark .btn-line:hover{border-color:var(--on-dark)}
.btn-sm{padding:10px 20px;font-size:15px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

/* ============ header ============ */
.hdr{position:sticky;top:0;z-index:60;background:rgba(14,36,54,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.07);
  padding-top:env(safe-area-inset-top,0px)}
.hdr .wrap{display:flex;align-items:center;gap:var(--s3);height:72px}
.hdr .logo{height:38px;width:auto;display:block;flex:0 0 auto}
.logo-w{display:block;line-height:0}
html[data-lang="ar"] span.en.logo-w{display:none!important}
html[data-lang="en"] span.ar.logo-w{display:none!important}
.nav{display:flex;gap:26px;margin-inline-start:auto;font-size:15.5px;
  font-weight:500;color:var(--on-dark-muted)}
.nav a{padding:6px 0;border-bottom:2px solid transparent;transition:color .18s}
.nav a:hover{color:var(--on-dark);border-bottom-color:var(--orange)}
.hdr-act{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.lang{background:none;border:1px solid var(--navy-3);color:var(--on-dark-muted);
  border-radius:var(--r-sm);padding:7px 13px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:var(--fs)}
.lang:hover{color:var(--on-dark);border-color:var(--on-dark-muted)}
.burger{display:none;background:none;border:0;padding:8px;cursor:pointer}
.burger span{display:block;width:22px;height:2px;background:var(--on-dark);
  border-radius:2px;margin:4px 0}
.mnav{display:none}

/* ============ hero ============ */
.hero{background:var(--navy);color:var(--on-dark);padding:var(--s6) 0 0;
  position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-18%;top:-22%;
  width:58%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(240,90,18,.16),transparent 66%);
  pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:var(--s5);
  align-items:center}
.hero h1{max-width:15ch}
.hero .sub{color:var(--on-dark-muted);font-size:clamp(17px,1.5vw,20.5px);
  max-width:48ch;margin-top:var(--s3)}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:var(--s4)}
.herovis{width:100%;display:block}
.skyline{display:flex;align-items:flex-end;gap:10px;margin-top:var(--s5);
  height:90px}
.skyline i{flex:1;border-radius:10px 10px 0 0;background:var(--navy-2)}
.skyline i.on{background:var(--orange)}

/* ============ value pillars ============ */
.vp-lead{max-width:22ch;margin-bottom:var(--s3)}
.vp-lead em{font-style:normal;color:var(--orange-ink);display:block}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
  gap:0;border-top:1px solid var(--line)}
.pillar{padding:var(--s4) var(--s3) var(--s4) 0;border-bottom:1px solid var(--line);
  border-inline-end:1px solid var(--line)}
.pillar:last-child{border-inline-end:0}
.pillar h3{margin-bottom:6px}
.pillar p{color:var(--muted);font-size:16px}
.pnum{display:block;width:26px;height:4px;border-radius:2px;background:var(--orange);
  margin-bottom:var(--s2)}
.pillar:nth-child(2) .pnum{width:38px;opacity:.78}
.pillar:nth-child(3) .pnum{width:50px;opacity:.56}
.pillar:nth-child(4) .pnum{width:62px;opacity:.34}

/* ============ cards / services ============ */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(286px,1fr));
  gap:var(--s3)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s4) var(--s3);transition:border-color .2s ease,transform .2s ease}
.card:hover{border-color:var(--orange);transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){.card:hover{transform:none}}
.card h3{margin-bottom:8px}
.card p{color:var(--muted);font-size:16px}
.card-ico{display:grid;place-items:center;width:46px;height:46px;
  border-radius:var(--r-md);background:var(--orange-soft);color:var(--orange-ink);
  margin-bottom:var(--s3)}

/* ============ process ============ */
.steps{list-style:none;margin:0;padding:0;counter-reset:st;position:relative;
  max-width:860px}
.steps::before{content:"";position:absolute;inset-inline-start:17px;top:14px;
  bottom:14px;width:2px;background:var(--navy-3)}
.pstep{display:grid;grid-template-columns:36px 1fr;gap:var(--s3);
  padding:var(--s3) 0;position:relative}
.pdot{counter-increment:st;width:36px;height:36px;border-radius:50%;
  background:var(--navy-2);border:2px solid var(--navy-3);display:grid;
  place-items:center;font-size:14px;font-weight:700;color:var(--on-dark);
  position:relative;z-index:1}
.pdot::after{content:counter(st,decimal-leading-zero)}
.pstep:last-child .pdot{background:var(--orange);border-color:var(--orange);
  color:#fff}
.pstep h3{margin-bottom:4px}
.pstep p{color:var(--on-dark-muted);font-size:16.5px;max-width:58ch}

/* ============ why us ============ */
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:var(--s3) var(--s4)}
.why-item{display:grid;grid-template-columns:auto 1fr;gap:var(--s2);
  align-items:start;padding-block:var(--s2)}
.tick{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;
  background:var(--orange-soft);color:var(--orange-ink);margin-top:2px}
.why-item h3{margin-bottom:2px}
.why-item p{color:var(--muted);font-size:16px}

/* ============ industries ============ */
.inds{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:12px}
.ind{border:1px solid var(--line);border-radius:999px;padding:11px 24px;
  font-weight:500;font-size:16.5px;transition:border-color .2s,background .2s}
.ind:hover{border-color:var(--orange);background:var(--orange-soft)}
.ind-note{color:var(--muted);font-size:15px;margin-top:var(--s3);
  max-width:var(--measure)}

/* ============ work / concepts ============ */
.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));
  gap:var(--s3)}
.work{background:var(--sand);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.work .mock{width:100%;display:block;border-radius:var(--r-md)}
.work h3{font-size:17px}
.work p{color:var(--muted);font-size:15px}
.tag{align-self:flex-start;font-size:12.5px;font-weight:600;
  color:var(--orange-ink);background:var(--paper);border:1px solid var(--line);
  border-radius:999px;padding:4px 12px}


/* ============ real estate ============ */
.re-split{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);
  margin-top:var(--s5)}
.re-col h3.re-h{font-size:clamp(21px,2.1vw,26px);font-weight:700;
  margin-bottom:var(--s3);padding-bottom:var(--s2);
  border-bottom:2px solid var(--orange);display:inline-block}
.side{list-style:none;margin:0;padding:0;display:grid;gap:var(--s3)}
.side-row{display:grid;grid-template-columns:auto 1fr;gap:var(--s2);
  align-items:start}
.side-row h3{font-size:17px;margin-bottom:2px}
.side-row p{color:var(--muted);font-size:15.5px}
.re-note{margin-top:var(--s5);padding:var(--s3);border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--paper);color:var(--muted);
  font-size:15.5px;max-width:var(--measure)}
.re-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:var(--s4)}
@media (max-width:760px){.re-split{grid-template-columns:1fr;gap:var(--s4)}}

/* ============ about ============ */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);
  align-items:start}
.about-q{font-size:clamp(23px,2.6vw,31px);font-weight:600;line-height:1.42;
  letter-spacing:-.01em;max-width:20ch}
.about-q b{color:var(--orange-ink);font-weight:600}
.about-body p{color:var(--muted);margin-bottom:var(--s2);max-width:var(--measure)}

/* ============ closing cta ============ */
.cta-box{text-align:center;max-width:640px;margin:0 auto}
.cta-box h2{margin-bottom:var(--s2)}
.cta-box p{margin-bottom:var(--s4)}

/* ============ footer ============ */
.ft{background:var(--navy);color:var(--on-dark-muted);padding:var(--s5) 0 var(--s4)}
.ft-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:var(--s4);
  padding-bottom:var(--s4);border-bottom:1px solid var(--navy-3)}
.logo-foot{height:34px;width:auto;display:block;margin-bottom:var(--s2)}
.ft .ft-h{margin:0 0 var(--s2);font-size:14px;font-weight:600;color:var(--on-dark)}
.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:15px}
.ft a:hover{color:var(--on-dark)}
.ft .pos{font-size:15px;max-width:34ch}
.ft-bot{display:flex;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;
  padding-top:var(--s3);font-size:14px}
.ltr{direction:ltr;display:inline-block}

/* ============ reveal ============ */
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

/* ============ responsive ============ */
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr;gap:var(--s4)}
  .herovis{max-width:520px}
  .about-grid{grid-template-columns:1fr;gap:var(--s3)}
  .ft-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .nav{display:none}
  .burger{display:block;margin-inline-start:auto}
  .hdr-act .btn{display:none}
  .mnav{display:block;position:fixed;inset:0;top:calc(72px + env(safe-area-inset-top,0px));
    background:var(--navy);padding:var(--s3);transform:translateY(-12px);
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
    z-index:59;overflow-y:auto}
  .mnav.open{opacity:1;transform:none;pointer-events:auto}
  .mnav a{display:block;padding:15px 4px;font-size:19px;font-weight:600;
    color:var(--on-dark);border-bottom:1px solid var(--navy-3)}
  .mnav .btn{width:100%;margin-top:var(--s3)}
  :root{--s5:52px;--s6:64px}
  body{font-size:16.5px}
  .lede{font-size:17.5px}
  .pillar{border-inline-end:0;padding-inline-end:0}
  .cta-row .btn{width:100%}
  .ft-grid{grid-template-columns:1fr;gap:var(--s3)}
  .skyline{height:62px;gap:7px}
}
</style>
</head>

    <p class="sub" style="margin:var(--s3) auto var(--s4);max-width:34ch">
      <span class="ar">الصفحة اللي بتدوّر عليها مش موجودة.</span>
      <span class="en">The page you're looking for doesn't exist.</span>
    </p>
    <a class="btn btn-main" href="/">
      <span class="ar">رجوع للصفحة الرئيسية</span>
      <span class="en">Back to home</span>
    </a>
  </div>
</main>
</body>
