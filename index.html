<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة العقارات — واجهة جو</title>
<style>
:root{
  --navy:#0E2436; --navy-2:#16324A; --orange:#F05A12; --orange-ink:#C4430A;
  --orange-soft:#FFEDE2; --sand:#FBF6EE; --paper:#fff; --ink:#16202A;
  --muted:#5A6470; --line:#E6DCCD; --ok:#1B7F4B; --warn:#8A6100; --bad:#B22222;
  --r:12px; --s1:6px; --s2:12px; --s3:20px; --s4:32px;
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);line-height:1.6}
header{background:var(--navy);color:var(--sand);padding:var(--s3);
  display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;
  padding-top:calc(var(--s3) + env(safe-area-inset-top,0px))}
header h1{font-size:19px;margin:0;font-weight:600}
header .who{margin-inline-start:auto;font-size:13px;color:#A8B6C4}
main{max-width:1100px;margin:0 auto;padding:var(--s3)}
.bar{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-bottom:var(--s3)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin-bottom:var(--s1)}
.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:var(--r);
  border:1px solid transparent;cursor:pointer;background:var(--orange);color:#fff}
.btn:hover{background:var(--orange-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:var(--s3)}
@media(min-width:760px){.cols-2{grid-template-columns:1fr 1fr}
  .cols-3{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s3)}
.row{display:flex;gap:var(--s2);align-items:center;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);padding:var(--s2);
  margin-bottom:var(--s2);flex-wrap:wrap}
.row img{width:84px;height:62px;object-fit:cover;border-radius:8px;background:var(--sand);flex:0 0 auto}
.row .meta{flex:1 1 220px;min-width:0}
.row .meta b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta small{color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;
  border:1px solid currentColor}
.t-av{color:var(--ok)} .t-re{color:var(--warn)} .t-so{color:var(--bad)}
.t-dr{color:var(--muted)}
.thumbs{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2)}
.thumb{position:relative;width:110px}
.thumb img{width:110px;height:82px;object-fit:cover;border-radius:8px;display:block}
.thumb .ctl{display:flex;gap:4px;margin-top:4px}
.thumb button{flex:1;font:inherit;font-size:12px;padding:3px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);border-radius:6px}
.thumb.cover::after{content:"الغلاف";position:absolute;top:5px;inset-inline-start:5px;
  background:var(--orange);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px}
.note{background:var(--orange-soft);border:1px solid var(--orange);color:var(--orange-ink);
  padding:var(--s2) var(--s3);border-radius:var(--r);margin-bottom:var(--s3);font-size:14px}
.hide{display:none}
.muted{color:var(--muted);font-size:13px}
#drop{border:2px dashed var(--line);border-radius:var(--r);padding:var(--s4);
  text-align:center;color:var(--muted);cursor:pointer}
#drop.over{border-color:var(--orange);background:var(--orange-soft)}
</style>
</head>
<body>

<header>
  <h1>لوحة العقارات</h1>
  <span class="who" id="who"></span>
</header>

<main>
  <div id="msg" class="note hide"></div>

  <!-- ===== قائمة العقارات ===== -->
  <section id="listView">
    <div class="bar">
      <button class="btn" id="newBtn">+ عقار جديد</button>
      <select id="fType" style="width:auto">
        <option value="all">كل الأنواع</option>
        <option value="land">أراضي</option>
        <option value="villa">فلل</option>
        <option value="apartment">شقق</option>
      </select>
      <input id="fQ" placeholder="بحث بالعنوان أو المنطقة أو الرقم" style="width:auto;flex:1;min-width:200px">
    </div>
    <div id="list"></div>
    <div class="bar" style="justify-content:center">
      <button class="btn ghost" id="more">تحميل المزيد</button>
    </div>
  </section>

  <!-- ===== نموذج التحرير ===== -->
  <section id="formView" class="hide">
    <div class="bar">
      <button class="btn ghost" id="backBtn">رجوع للقائمة</button>
      <strong id="refLabel" class="muted"></strong>
    </div>

    <div class="card grid" style="margin-bottom:var(--s3)">
      <div class="grid cols-3">
        <div><label>النوع</label>
          <select id="type">
            <option value="apartment">شقة</option>
            <option value="villa">فيلا</option>
            <option value="land">أرض</option>
          </select></div>
        <div><label>الحالة</label>
          <select id="status">
            <option value="available">متاح</option>
            <option value="reserved">محجوز</option>
            <option value="sold">مباع</option>
          </select></div>
        <div><label>ترتيب الظهور (الأعلى أولاً)</label>
          <input id="sort_order" type="number" value="0"></div>
      </div>

      <div><label>العنوان بالعربية *</label>
        <input id="title_ar" placeholder="شقة ١٨٠م مع ترس — خلدا"></div>
      <div><label>العنوان بالإنجليزية</label>
        <input id="title_en" placeholder="180 sqm apartment with terrace — Khalda"></div>

      <div class="grid cols-3">
        <div><label>المدينة</label><input id="city" value="عمّان"></div>
        <div><label>المنطقة *</label><input id="area_name" placeholder="خلدا"></div>
        <div><label>عمر البناء (سنوات)</label><input id="age_years" type="number"></div>
      </div>

      <div class="grid cols-3">
        <div><label>مساحة البناء (م²)</label><input id="size_m2" type="number"></div>
        <div><label>مساحة الأرض (م²)</label><input id="land_m2" type="number"></div>
        <div><label>الطابق</label><input id="floor_no" type="number"></div>
      </div>

      <div class="grid cols-3">
        <div><label>غرف النوم</label><input id="bedrooms" type="number"></div>
        <div><label>الحمامات</label><input id="bathrooms" type="number"></div>
        <div><label>السعر (دينار)</label><input id="price" type="number"></div>
      </div>

      <div>
        <label style="display:flex;gap:8px;align-items:center;font-weight:600">
          <input type="checkbox" id="show_price" style="width:auto">
          أظهر السعر لهذا العقار
        </label>
        <p class="muted" style="margin:4px 0 0">
          مطفأ افتراضياً — الموقع يعرض «السعر عند الطلب». السعر يُحفظ دائماً لاستخدامك الداخلي.
        </p>
      </div>

      <div><label>الوصف بالعربية</label><textarea id="description_ar"></textarea></div>
      <div><label>المميزات (افصل بفاصلة)</label>
        <input id="features" placeholder="مصعد، تدفئة، موقف سيارة، حديقة"></div>

      <div>
        <label style="display:flex;gap:8px;align-items:center;font-weight:600">
          <input type="checkbox" id="published" style="width:auto">
          منشور — يظهر للزوار على الموقع
        </label>
      </div>

      <div class="bar" style="margin:0">
        <button class="btn" id="saveBtn">حفظ</button>
        <button class="btn danger" id="delBtn">حذف العقار</button>
      </div>
    </div>

    <!-- ===== الصور ===== -->
    <div class="card" id="imgCard">
      <label>الصور</label>
      <p class="muted" style="margin-top:0">
        الصورة الأولى هي الغلاف. تُصغَّر الصور في متصفحك قبل الرفع، فلا داعي لتجهيزها مسبقاً.
      </p>
      <div id="drop">اسحب الصور هنا أو اضغط للاختيار</div>
      <input type="file" id="file" accept="image/*" multiple class="hide">
      <div class="thumbs" id="thumbs"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const FIELDS = ["type","status","sort_order","title_ar","title_en","city","area_name",
  "age_years","size_m2","land_m2","floor_no","bedrooms","bathrooms","price",
  "description_ar"];
let current = null, page = 1, listDone = false;

function flash(text, bad) {
  const m = $("msg");
  m.textContent = text;
  m.style.background = bad ? "#FDECEC" : "var(--orange-soft)";
  m.style.borderColor = bad ? "#B22222" : "var(--orange)";
  m.style.color = bad ? "#B22222" : "var(--orange-ink)";
  m.classList.remove("hide");
  clearTimeout(flash.t);
  flash.t = setTimeout(() => m.classList.add("hide"), 4000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (res.status === 401 || res.status === 403) {
    flash("انتهت الجلسة — حدّث الصفحة لتسجيل الدخول", true);
    throw new Error("auth");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { flash(data.error || "حدث خطأ", true); throw new Error(data.error); }
  return data;
}

/* ---------- القائمة ---------- */
const TYPE_AR = { land: "أرض", villa: "فيلا", apartment: "شقة" };
const STATUS = { available: ["متاح","t-av"], reserved: ["محجوز","t-re"], sold: ["مباع","t-so"] };

async function loadList(reset) {
  if (reset) { page = 1; listDone = false; $("list").innerHTML = ""; }
  const p = new URLSearchParams({ all: "1", status: "all", page, limit: "24" });
  if ($("fType").value !== "all") p.set("type", $("fType").value);
  if ($("fQ").value.trim()) p.set("q", $("fQ").value.trim());

  const data = await api("/api/properties?" + p);
  for (const it of data.items) $("list").appendChild(rowEl(it));
  listDone = page * data.limit >= data.total;
  $("more").style.display = listDone ? "none" : "";
  if (!data.total) $("list").innerHTML = '<p class="muted">لا يوجد عقارات بعد.</p>';
  page++;
}

function rowEl(it) {
  const d = document.createElement("div");
  d.className = "row";
  const [label, cls] = STATUS[it.status] || STATUS.available;
  const size = it.size_m2 || it.land_m2;
  d.innerHTML = `
    <img src="${it.cover || 'data:image/gif;base64,R0lGODlhAQABAAAAACw='}" alt="">
    <div class="meta">
      <b>${esc(it.title_ar)}</b>
      <small>${it.ref} · ${TYPE_AR[it.type]} · ${esc(it.area_name)}${size ? " · " + size + "م²" : ""}</small>
    </div>
    <span class="tag ${cls}">${label}</span>
    <span class="tag ${it.published ? "t-av" : "t-dr"}">${it.published ? "منشور" : "مسودة"}</span>
    <button class="btn ghost">تعديل</button>`;
  d.querySelector("button").onclick = () => openForm(it.id);
  return d;
}

const esc = (s) => String(s ?? "").replace(/[<>&"]/g,
  (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

/* ---------- النموذج ---------- */
function show(view) {
  $("listView").classList.toggle("hide", view !== "list");
  $("formView").classList.toggle("hide", view !== "form");
  window.scrollTo(0, 0);
}

function blank() {
  current = null;
  FIELDS.forEach((f) => $(f).value = "");
  $("type").value = "apartment"; $("status").value = "available";
  $("city").value = "عمّان"; $("sort_order").value = "0";
  $("features").value = ""; $("published").checked = false;
  $("show_price").checked = false;
  $("refLabel").textContent = "عقار جديد — احفظ أولاً ثم أضف الصور";
  $("imgCard").style.opacity = .4; $("imgCard").style.pointerEvents = "none";
  $("thumbs").innerHTML = ""; $("delBtn").style.display = "none";
  show("form");
}

async function openForm(id) {
  const it = await api("/api/properties/" + id);
  current = it;
  FIELDS.forEach((f) => $(f).value = it[f] ?? "");
  $("features").value = (it.features || []).join("، ");
  $("published").checked = !!it.published;
  $("show_price").checked = !!it.show_price;
  $("refLabel").textContent = it.ref;
  $("imgCard").style.opacity = 1; $("imgCard").style.pointerEvents = "auto";
  $("delBtn").style.display = "";
  renderThumbs(it.images || []);
  show("form");
}

function collect() {
  const body = {};
  FIELDS.forEach((f) => body[f] = $(f).value);
  body.features = $("features").value.split(/[،,]/).map((s) => s.trim()).filter(Boolean);
  body.published = $("published").checked ? 1 : 0;
  body.show_price = $("show_price").checked ? 1 : 0;
  return body;
}

$("saveBtn").onclick = async () => {
  $("saveBtn").disabled = true;
  try {
    const body = JSON.stringify(collect());
    const h = { "content-type": "application/json" };
    if (current) {
      current = await api("/api/properties/" + current.id,
        { method: "PATCH", headers: h, body });
      flash("تم الحفظ");
    } else {
      current = await api("/api/properties", { method: "POST", headers: h, body });
      $("refLabel").textContent = current.ref;
      $("imgCard").style.opacity = 1; $("imgCard").style.pointerEvents = "auto";
      $("delBtn").style.display = "";
      flash("تم الإنشاء — أضف الصور الآن");
    }
  } catch {} finally { $("saveBtn").disabled = false; }
};

$("delBtn").onclick = async () => {
  if (!current) return;
  if (!confirm(`حذف ${current.ref} نهائياً مع كل صوره؟`)) return;
  await api("/api/properties/" + current.id, { method: "DELETE" });
  flash("تم الحذف"); show("list"); loadList(true);
};

/* ---------- الصور ---------- */
/* التصغير يتم في المتصفح: صورة ٥ ميغا من الجوال تصل الزائر بحجم صغير،
   ويوفّر ذلك رفعاً بطيئاً على شبكة الجوال. */
const MAXDIM = 1600, QUALITY = 0.82;

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAXDIM / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      c.toBlob((b) => b ? resolve({ blob: b, w, h }) : reject(new Error("فشل")),
        "image/jpeg", QUALITY);
    };
    img.onerror = () => reject(new Error("تعذّر قراءة الصورة"));
    img.src = URL.createObjectURL(file);
  });
}

async function upload(files) {
  if (!current) return flash("احفظ العقار أولاً", true);
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    try {
      const { blob, w, h } = await shrink(f);
      const fd = new FormData();
      fd.append("file", blob, "photo.jpg");
      fd.append("property_id", current.id);
      fd.append("width", w); fd.append("height", h);
      fd.append("alt", $("title_ar").value);
      const img = await api("/api/upload", { method: "POST", body: fd });
      current.images = [...(current.images || []), img];
      renderThumbs(current.images);
    } catch (e) { flash("تعذّر رفع صورة: " + e.message, true); }
  }
}

function renderThumbs(images) {
  const box = $("thumbs");
  box.innerHTML = "";
  images.forEach((img, i) => {
    const d = document.createElement("div");
    d.className = "thumb" + (i === 0 ? " cover" : "");
    d.innerHTML = `<img src="${img.url}" alt="">
      <div class="ctl">
        <button title="تقديم">→</button>
        <button title="تأخير">←</button>
        <button title="حذف">حذف</button>
      </div>`;
    const [fwd, back, del] = d.querySelectorAll("button");
    fwd.onclick = () => move(i, -1);
    back.onclick = () => move(i, 1);
    del.onclick = async () => {
      if (!confirm("حذف هذه الصورة؟")) return;
      await api("/api/upload?id=" + img.id, { method: "DELETE" });
      current.images = current.images.filter((x) => x.id !== img.id);
      renderThumbs(current.images);
    };
    box.appendChild(d);
  });
}

async function move(i, dir) {
  const arr = current.images;
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  renderThumbs(arr);
  await api("/api/upload", {
    method: "PATCH", headers: { "content-type": "application/json" },
    body: JSON.stringify({ order: arr.map((x) => x.id) }),
  });
}

/* ---------- الربط ---------- */
$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => { upload(e.target.files); e.target.value = ""; };
["dragenter","dragover"].forEach((ev) => $("drop").addEventListener(ev, (e) => {
  e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave","drop"].forEach((ev) => $("drop").addEventListener(ev, (e) => {
  e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => upload(e.dataTransfer.files));

$("newBtn").onclick = blank;
$("backBtn").onclick = () => { show("list"); loadList(true); };
$("more").onclick = () => loadList(false);
$("fType").onchange = () => loadList(true);
let qt; $("fQ").oninput = () => { clearTimeout(qt); qt = setTimeout(() => loadList(true), 300); };

fetch("/api/whoami").then((r) => r.json())
  .then((d) => $("who").textContent = d.email || "")
  .catch(() => {});
loadList(true);
</script>
</body>
</html>
